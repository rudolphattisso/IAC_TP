services:
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  app:
    build:
      context: ../..
      dockerfile: docker/app/Dockerfile
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - uploads:/var/www/html/uploads
    # Port direct pour test local — Traefik gère le routing en prod (Linux/AWS)
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`gestion-produits.local`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ../../gestion-produits/database/gestion_produits.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Variante PostgreSQL ---
  # Accessible via https://gestion-produits-pgsql.local (URL distincte exigée par le sujet)
  # Tourne en parallèle de la variante MySQL sur le même réseau

  app-pgsql:
    build:
      context: ../..
      dockerfile: docker/app-pgsql/Dockerfile
    environment:
      DB_HOST: db-pgsql
      DB_USER: ${PGSQL_USER}
      DB_PASSWORD: ${PGSQL_PASSWORD}
      DB_NAME: ${PGSQL_DB}
    volumes:
      - uploads-pgsql:/var/www/html/uploads
    # Port direct pour test local
    ports:
      - "8081:80"
    depends_on:
      db-pgsql:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-pgsql.rule=Host(`gestion-produits-pgsql.local`)"
      - "traefik.http.routers.app-pgsql.entrypoints=websecure"
      - "traefik.http.routers.app-pgsql.tls=true"
      - "traefik.http.services.app-pgsql.loadbalancer.server.port=80"

  db-pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PGSQL_DB}
      POSTGRES_USER: ${PGSQL_USER}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD}
    volumes:
      - db-pgsql-data:/var/lib/postgresql/data
      - ../../gestion-produits/database/gestion_produits_pgsql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGSQL_USER} -d ${PGSQL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  uploads:
  db-pgsql-data:
  uploads-pgsql:
