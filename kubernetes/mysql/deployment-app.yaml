# Remplacer ranawane93 par ton pseudo Docker Hub
# Construire et pousser l'image AVANT de déployer :
#   docker build -t ranawane93/gestion-produits-mysql:latest -f docker/app/Dockerfile .
#   docker push ranawane93/gestion-produits-mysql:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: gestion-produits
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-produits
  template:
    metadata:
      labels:
        app: gestion-produits
    spec:
      containers:
        - name: php-app
          image: ranawane93/gestion-produits-mysql:latest
          env:
            - name: DB_HOST
              value: db-service
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: db-name
          ports:
            - containerPort: 80
          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/uploads
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
